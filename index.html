<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#12151C" />
<title>Money Manager</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #12151C; color: #EDEFF3; font-family: 'Inter', sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .serif { font-family: 'Fraunces', serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2B3242; border-radius: 4px; }
  input, select { font-family: 'Inter', sans-serif; }
  input:focus, select:focus { outline: none; border-color: #C99A3E !important; }
  .row-hover:hover { background: #1E2430; }
  button { cursor: pointer; font-family: 'Inter', sans-serif; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px);} to { opacity: 1; transform: translate(-50%, 0);} }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "money-manager-v2";
const CATEGORIES = ["Food", "Travel", "Bills", "Rent", "Shopping", "Health", "Entertainment", "Other"];
const ACCOUNT_COLORS = ["#4F9D6E", "#6B7FD7", "#C25B4A", "#4FA0C9", "#B879C9", "#9DB84F"];
const CASH_COLOR = "#C99A3E";

const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const fmtDate = (d) => {
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
};

const EMPTY = { cash: 0, accounts: [], receivables: [], payables: [], loans: [], expenses: [] };

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...EMPTY, ...JSON.parse(raw) };
  } catch (e) {}
  return EMPTY;
}

function MoneyManager() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState("overview");
  const [toast, setToast] = useState("");
  const saveTimer = useRef(null);

  useEffect(() => {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }, 250);
  }, [data]);

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(""), 1800); };

  const totalReceivable = data.receivables.reduce((s, r) => s + Number(r.amount), 0);
  const totalPayable = data.payables.reduce((s, p) => s + Number(p.amount), 0);
  const totalLoan = data.loans.reduce((s, l) => s + Number(l.remaining), 0);
  const totalAccounts = data.accounts.reduce((s, a) => s + Number(a.balance), 0);
  const totalCash = Number(data.cash) || 0;
  const netWorth = totalCash + totalAccounts + totalReceivable - totalPayable - totalLoan;
  const totalExpense = data.expenses.reduce((s, e) => s + Number(e.amount), 0);

  const accountColor = (id) => {
    const idx = data.accounts.findIndex(a => a.id === id);
    return ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length] || "#8A93A6";
  };
  const sourceLabel = (source) => {
    if (!source || source.type === "cash") return "Cash";
    const acc = data.accounts.find(a => a.id === source.accountId);
    return acc ? acc.name : "Deleted account";
  };
  const sourceColor = (source) => {
    if (!source || source.type === "cash") return CASH_COLOR;
    return accountColor(source.accountId);
  };

  const applyExpenseToBalances = (d, source, amount, sign) => {
    if (!source || source.type === "cash") return { ...d, cash: Number(d.cash) + sign * amount };
    return { ...d, accounts: d.accounts.map(a => a.id === source.accountId ? { ...a, balance: Number(a.balance) + sign * amount } : a) };
  };

  const addExpense = (item) => {
    setData(d => {
      const withDeduction = applyExpenseToBalances(d, item.source, item.amount, -1);
      return { ...withDeduction, expenses: [{ ...item, id: uid() }, ...withDeduction.expenses] };
    });
  };
  const deleteExpense = (id) => {
    setData(d => {
      const exp = d.expenses.find(e => e.id === id);
      if (!exp) return d;
      const refunded = applyExpenseToBalances(d, exp.source, exp.amount, +1);
      return { ...refunded, expenses: refunded.expenses.filter(e => e.id !== id) };
    });
  };

  return (
    <div style={{ minHeight: "100vh", background: "#12151C", color: "#EDEFF3" }}>
      <Header netWorth={netWorth} />
      <TabBar tab={tab} setTab={setTab} counts={{ accounts: data.accounts.length, receive: data.receivables.length, pay: data.payables.length, loans: data.loans.length, expenses: data.expenses.length }} />
      <main style={{ maxWidth: 720, margin: "0 auto", padding: "20px 16px 80px" }}>
        {tab === "overview" && <Overview data={data} totalCash={totalCash} totalAccounts={totalAccounts} totalReceivable={totalReceivable} totalPayable={totalPayable} totalLoan={totalLoan} totalExpense={totalExpense} accountColor={accountColor} sourceLabel={sourceLabel} sourceColor={sourceColor} />}
        {tab === "accounts" && <AccountsPanel data={data} setData={setData} accountColor={accountColor} flash={flash} />}
        {tab === "receive" && <LedgerList title="Money to receive" accent="#4F9D6E" symbol="↓" items={data.receivables} emptyText="No one owes you anything right now." onAdd={(item) => setData(d => ({ ...d, receivables: [{ ...item, id: uid() }, ...d.receivables] }))} onDelete={(id) => setData(d => ({ ...d, receivables: d.receivables.filter(x => x.id !== id) }))} flash={flash} verb="received" />}
        {tab === "pay" && <LedgerList title="Money to pay" accent="#C25B4A" symbol="↑" items={data.payables} emptyText="You don't owe anyone right now." onAdd={(item) => setData(d => ({ ...d, payables: [{ ...item, id: uid() }, ...d.payables] }))} onDelete={(id) => setData(d => ({ ...d, payables: d.payables.filter(x => x.id !== id) }))} flash={flash} verb="paid" />}
        {tab === "loans" && <LoansPanel loans={data.loans} onAdd={(item) => setData(d => ({ ...d, loans: [{ ...item, id: uid() }, ...d.loans] }))} onUpdate={(id, remaining) => setData(d => ({ ...d, loans: d.loans.map(l => l.id === id ? { ...l, remaining } : l) }))} onDelete={(id) => setData(d => ({ ...d, loans: d.loans.filter(x => x.id !== id) }))} flash={flash} />}
        {tab === "expenses" && <ExpensesPanel expenses={data.expenses} accounts={data.accounts} onAdd={(item) => { addExpense(item); flash("Expense logged & deducted"); }} onDelete={(id) => { deleteExpense(id); flash("Expense removed & refunded"); }} accountColor={accountColor} sourceLabel={sourceLabel} sourceColor={sourceColor} />}
      </main>
      {toast && <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#1A1F29", border: "1px solid #2B3242", color: "#EDEFF3", padding: "10px 18px", borderRadius: 8, fontSize: 13.5, animation: "toastIn .2s ease", boxShadow: "0 8px 24px rgba(0,0,0,.4)", zIndex: 50 }}>{toast}</div>}
    </div>
  );
}

function Header({ netWorth }) {
  const positive = netWorth >= 0;
  return (
    <div style={{ borderBottom: "1px solid #232A38", padding: "28px 16px 22px", background: "linear-gradient(180deg, #171B24 0%, #12151C 100%)" }}>
      <div style={{ maxWidth: 720, margin: "0 auto", position: "relative", paddingLeft: 14 }}>
        <div style={{ position: "absolute", left: 0, top: 2, bottom: 2, width: 2, background: "#8B2E2E", borderRadius: 2 }} />
        <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", color: "#8A93A6", marginBottom: 6 }}>Your khata</div>
        <div className="serif num" style={{ fontSize: 40, fontWeight: 600, lineHeight: 1, color: positive ? "#EDEFF3" : "#D98072" }}>{inr(netWorth)}</div>
        <div style={{ fontSize: 12.5, color: "#8A93A6", marginTop: 6 }}>Net worth · cash + accounts + receivables − payables − loans</div>
      </div>
    </div>
  );
}

function TabBar({ tab, setTab, counts }) {
  const tabs = [
    { id: "overview", label: "Overview" },
    { id: "accounts", label: "Accounts", count: counts.accounts },
    { id: "receive", label: "Receive", count: counts.receive },
    { id: "pay", label: "Pay", count: counts.pay },
    { id: "loans", label: "Loans", count: counts.loans },
    { id: "expenses", label: "Expenses", count: counts.expenses },
  ];
  return (
    <div style={{ borderBottom: "1px solid #232A38", position: "sticky", top: 0, background: "#12151C", zIndex: 10 }}>
      <div style={{ maxWidth: 720, margin: "0 auto", display: "flex", overflowX: "auto", padding: "0 16px" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ background: "none", border: "none", padding: "13px 14px", fontSize: 13.5, fontWeight: 600, whiteSpace: "nowrap", color: tab === t.id ? "#EDEFF3" : "#697084", borderBottom: tab === t.id ? "2px solid #C99A3E" : "2px solid transparent", marginBottom: -1, display: "flex", alignItems: "center", gap: 6 }}>
            {t.label}
            {!!t.count && <span style={{ fontSize: 10.5, background: "#232A38", color: "#8A93A6", borderRadius: 20, padding: "1px 6px" }}>{t.count}</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

function Card({ children, style }) {
  return <div style={{ background: "#1A1F29", border: "1px solid #232A38", borderRadius: 12, padding: 16, ...style }}>{children}</div>;
}

function StatTile({ label, value, color, symbol }) {
  return (
    <div style={{ background: "#1A1F29", border: "1px solid #232A38", borderRadius: 12, padding: "14px 16px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#8A93A6", fontSize: 11.5, marginBottom: 8, textTransform: "uppercase", letterSpacing: .5 }}>
        <span style={{ color }}>{symbol}</span> {label}
      </div>
      <div className="num" style={{ fontSize: 20, fontWeight: 700, color: color || "#EDEFF3" }}>{inr(value)}</div>
    </div>
  );
}

function Field({ label, children }) {
  return <div style={{ flex: 1 }}><div style={{ fontSize: 11, color: "#8A93A6", marginBottom: 4 }}>{label}</div>{children}</div>;
}

function MoneyInput({ value, onChange, placeholder }) {
  return (
    <div style={{ position: "relative" }}>
      <span style={{ position: "absolute", left: 10, top: 9, color: "#697084", fontSize: 13.5 }}>₹</span>
      <input type="number" value={value} placeholder={placeholder || "0"} onChange={e => onChange(e.target.value)} style={{ width: "100%", background: "#12151C", border: "1px solid #2B3242", borderRadius: 8, padding: "9px 10px 9px 24px", color: "#EDEFF3", fontSize: 13.5 }} />
    </div>
  );
}

function TextInput({ value, onChange, placeholder }) {
  return <input value={value} placeholder={placeholder} onChange={e => onChange(e.target.value)} style={{ width: "100%", background: "#12151C", border: "1px solid #2B3242", borderRadius: 8, padding: "9px 10px", color: "#EDEFF3", fontSize: 13.5 }} />;
}

function Overview({ data, totalCash, totalAccounts, totalReceivable, totalPayable, totalLoan, totalExpense, accountColor, sourceLabel, sourceColor }) {
  const byCategory = {};
  data.expenses.forEach(e => { byCategory[e.category] = (byCategory[e.category] || 0) + Number(e.amount); });
  const catList = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const maxCat = catList.length ? catList[0][1] : 1;

  const bySource = {};
  data.expenses.forEach(e => { const key = sourceLabel(e.source); bySource[key] = (bySource[key] || 0) + Number(e.amount); });
  const sourceList = Object.entries(bySource).sort((a, b) => b[1] - a[1]);

  return (
    <div style={{ animation: "slideUp .25s ease" }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
        <StatTile label="To receive" value={totalReceivable} color="#4F9D6E" symbol="↓" />
        <StatTile label="To pay" value={totalPayable} color="#C25B4A" symbol="↑" />
        <StatTile label="Loan outstanding" value={totalLoan} color="#6B7FD7" symbol="⌂" />
        <StatTile label="Total spent" value={totalExpense} color="#C99A3E" symbol="₹" />
      </div>

      <Card style={{ marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#8A93A6", marginBottom: 12 }}>Where your money sits</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}><span style={{ width: 8, height: 8, borderRadius: 4, background: CASH_COLOR }} /><span style={{ fontSize: 13.5 }}>Cash</span></div>
            <span className="num" style={{ fontWeight: 700, fontSize: 14 }}>{inr(totalCash)}</span>
          </div>
          {data.accounts.map(a => (
            <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}><span style={{ width: 8, height: 8, borderRadius: 4, background: accountColor(a.id) }} /><span style={{ fontSize: 13.5 }}>{a.name}</span></div>
              <span className="num" style={{ fontWeight: 700, fontSize: 14, color: a.balance < 0 ? "#D98072" : "#EDEFF3" }}>{inr(a.balance)}</span>
            </div>
          ))}
          {data.accounts.length === 0 && <div style={{ fontSize: 12.5, color: "#697084" }}>No bank accounts added yet — see the Accounts tab.</div>}
        </div>
        <div style={{ borderTop: "1px solid #232A38", marginTop: 12, paddingTop: 10, display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontSize: 12.5, color: "#8A93A6" }}>Total liquid</span>
          <span className="num" style={{ fontWeight: 700 }}>{inr(totalCash + totalAccounts)}</span>
        </div>
      </Card>

      {catList.length > 0 && (
        <Card style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 13, color: "#8A93A6", marginBottom: 12 }}>Spending by category</div>
          {catList.map(([cat, amt]) => (
            <div key={cat} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}><span>{cat}</span><span className="num" style={{ fontWeight: 600 }}>{inr(amt)}</span></div>
              <div style={{ height: 5, background: "#232A38", borderRadius: 3 }}><div style={{ height: 5, width: `${(amt / maxCat) * 100}%`, background: "#C99A3E", borderRadius: 3, transition: "width .3s ease" }} /></div>
            </div>
          ))}
        </Card>
      )}

      {sourceList.length > 0 && (
        <Card>
          <div style={{ fontSize: 13, color: "#8A93A6", marginBottom: 12 }}>Spending by payment source</div>
          <div style={{ display: "flex", height: 10, borderRadius: 5, overflow: "hidden", marginBottom: 10 }}>
            {sourceList.map(([label, amt]) => <div key={label} style={{ width: `${(amt / totalExpense) * 100}%`, background: label === "Cash" ? CASH_COLOR : sourceColor({ type: "account", accountId: data.accounts.find(a => a.name === label)?.id }) }} />)}
          </div>
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            {sourceList.map(([label, amt]) => (
              <div key={label} style={{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 6, color: "#8A93A6" }}>
                <span style={{ width: 8, height: 8, borderRadius: 4, background: label === "Cash" ? CASH_COLOR : sourceColor({ type: "account", accountId: data.accounts.find(a => a.name === label)?.id }) }} />
                {label}: <span className="num" style={{ color: "#EDEFF3", fontWeight: 600 }}>{inr(amt)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

function AccountsPanel({ data, setData, accountColor, flash }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [opening, setOpening] = useState("");
  const [editCashOpen, setEditCashOpen] = useState(false);
  const [cashVal, setCashVal] = useState(data.cash);
  const [editingId, setEditingId] = useState(null);
  const [editVal, setEditVal] = useState("");

  const addAccount = () => {
    if (!name.trim()) return;
    setData(d => ({ ...d, accounts: [...d.accounts, { id: uid(), name: name.trim(), balance: Number(opening) || 0 }] }));
    setName(""); setOpening(""); setOpen(false); flash("Account added");
  };
  const deleteAccount = (id) => { setData(d => ({ ...d, accounts: d.accounts.filter(a => a.id !== id) })); flash("Account removed"); };
  const saveCash = () => { setData(d => ({ ...d, cash: Number(cashVal) || 0 })); setEditCashOpen(false); flash("Cash balance updated"); };
  const startEditAccount = (a) => { setEditingId(a.id); setEditVal(a.balance); };
  const saveAccountBalance = (id) => { setData(d => ({ ...d, accounts: d.accounts.map(a => a.id === id ? { ...a, balance: Number(editVal) || 0 } : a) })); setEditingId(null); flash("Balance updated"); };

  return (
    <div style={{ animation: "slideUp .25s ease" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
        <div className="serif" style={{ fontSize: 20, fontWeight: 600 }}>Accounts</div>
        <button onClick={() => setOpen(o => !o)} style={{ background: open ? "#232A38" : "#4FA0C9", color: open ? "#EDEFF3" : "#12151C", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 700 }}>{open ? "Cancel" : "+ Add account"}</button>
      </div>

      {open && (
        <Card style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
            <Field label="Account name"><TextInput value={name} onChange={setName} placeholder="e.g. SBI Savings" /></Field>
            <Field label="Opening balance"><MoneyInput value={opening} onChange={setOpening} /></Field>
          </div>
          <button onClick={addAccount} style={{ background: "#4FA0C9", color: "#12151C", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 700, width: "100%" }}>Save account</button>
        </Card>
      )}

      <Card style={{ marginBottom: 10 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontSize: 14, fontWeight: 600 }}>💵 Cash</span></div>
          {!editCashOpen ? (
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span className="num" style={{ fontWeight: 700, color: CASH_COLOR, fontSize: 15 }}>{inr(data.cash)}</span>
              <button onClick={() => { setCashVal(data.cash); setEditCashOpen(true); }} style={{ background: "none", border: "none", color: "#697084", fontSize: 12 }}>Edit</button>
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <div style={{ width: 110 }}><MoneyInput value={cashVal} onChange={setCashVal} /></div>
              <button onClick={saveCash} style={{ background: CASH_COLOR, border: "none", borderRadius: 7, padding: "8px 9px", color: "#12151C", fontWeight: 700 }}>✓</button>
            </div>
          )}
        </div>
      </Card>

      {data.accounts.length === 0 ? (
        <EmptyState text="No bank accounts yet. Add one above to start splitting expenses by account." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {data.accounts.map(a => (
            <Card key={a.id}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 5, background: accountColor(a.id) }} />
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{a.name}</span>
                </div>
                {editingId !== a.id ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span className="num" style={{ fontWeight: 700, fontSize: 15, color: a.balance < 0 ? "#D98072" : accountColor(a.id) }}>{inr(a.balance)}</span>
                    <button onClick={() => startEditAccount(a)} style={{ background: "none", border: "none", color: "#697084", fontSize: 12 }}>Edit</button>
                    <button onClick={() => deleteAccount(a.id)} style={{ background: "none", border: "none", color: "#697084", fontSize: 12 }}>✕</button>
                  </div>
                ) : (
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <div style={{ width: 110 }}><MoneyInput value={editVal} onChange={setEditVal} /></div>
                    <button onClick={() => saveAccountBalance(a.id)} style={{ background: accountColor(a.id), border: "none", borderRadius: 7, padding: "8px 9px", color: "#12151C", fontWeight: 700 }}>✓</button>
                  </div>
                )}
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function LedgerList({ title, accent, symbol, items, onAdd, onDelete, emptyText, flash, verb }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const total = items.reduce((s, i) => s + Number(i.amount), 0);

  const submit = () => {
    if (!name.trim() || !amount) return;
    onAdd({ name: name.trim(), amount: Number(amount), note: note.trim(), date: today() });
    setName(""); setAmount(""); setNote(""); setOpen(false); flash(`Added to ${title.toLowerCase()}`);
  };

  return (
    <div style={{ animation: "slideUp .25s ease" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
        <div>
          <div className="serif" style={{ fontSize: 20, fontWeight: 600 }}>{title}</div>
          <div className="num" style={{ fontSize: 13, color: accent, fontWeight: 600, marginTop: 2 }}>{inr(total)} total</div>
        </div>
        <button onClick={() => setOpen(o => !o)} style={{ background: open ? "#232A38" : accent, color: open ? "#EDEFF3" : "#12151C", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 700 }}>{open ? "Cancel" : "+ Add"}</button>
      </div>

      {open && (
        <Card style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <Field label="Name"><TextInput value={name} onChange={setName} placeholder="e.g. Rahul" /></Field>
            <Field label="Amount"><MoneyInput value={amount} onChange={setAmount} /></Field>
          </div>
          <Field label="Note (optional)"><TextInput value={note} onChange={setNote} placeholder="e.g. lunch split" /></Field>
          <button onClick={submit} style={{ marginTop: 12, background: accent, color: "#12151C", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 700, width: "100%" }}>Save entry</button>
        </Card>
      )}

      {items.length === 0 ? <EmptyState text={emptyText} /> : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          {items.map((it, idx) => (
            <div key={it.id} className="row-hover" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 16px", borderBottom: idx < items.length - 1 ? "1px solid #232A38" : "none" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ color: accent }}>{symbol}</span>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{it.name}</div>
                  <div style={{ fontSize: 11.5, color: "#697084" }}>{fmtDate(it.date)}{it.note ? ` · ${it.note}` : ""}</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span className="num" style={{ fontWeight: 700, color: accent, fontSize: 14.5 }}>{inr(it.amount)}</span>
                <button onClick={() => { onDelete(it.id); flash(`Marked ${verb}`); }} style={{ background: "none", border: "none", color: "#697084", fontSize: 13 }}>✕</button>
              </div>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

function LoansPanel({ loans, onAdd, onUpdate, onDelete, flash }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [principal, setPrincipal] = useState("");
  const [note, setNote] = useState("");
  const total = loans.reduce((s, l) => s + Number(l.remaining), 0);

  const submit = () => {
    if (!name.trim() || !principal) return;
    onAdd({ name: name.trim(), principal: Number(principal), remaining: Number(principal), note: note.trim(), date: today() });
    setName(""); setPrincipal(""); setNote(""); setOpen(false); flash("Loan added");
  };

  return (
    <div style={{ animation: "slideUp .25s ease" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
        <div>
          <div className="serif" style={{ fontSize: 20, fontWeight: 600 }}>Loans</div>
          <div className="num" style={{ fontSize: 13, color: "#6B7FD7", fontWeight: 600, marginTop: 2 }}>{inr(total)} outstanding</div>
        </div>
        <button onClick={() => setOpen(o => !o)} style={{ background: open ? "#232A38" : "#6B7FD7", color: open ? "#EDEFF3" : "#12151C", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 700 }}>{open ? "Cancel" : "+ Add loan"}</button>
      </div>

      {open && (
        <Card style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <Field label="Lender / loan name"><TextInput value={name} onChange={setName} placeholder="e.g. HDFC personal loan" /></Field>
            <Field label="Principal amount"><MoneyInput value={principal} onChange={setPrincipal} /></Field>
          </div>
          <Field label="Note (optional)"><TextInput value={note} onChange={setNote} placeholder="e.g. 12% interest, EMI ₹4,500" /></Field>
          <button onClick={submit} style={{ marginTop: 12, background: "#6B7FD7", color: "#12151C", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 700, width: "100%" }}>Save loan</button>
        </Card>
      )}

      {loans.length === 0 ? <EmptyState text="No loans on record. Nothing owed to lenders." /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {loans.map(l => {
            const paidPct = l.principal > 0 ? Math.max(0, Math.min(100, ((l.principal - l.remaining) / l.principal) * 100)) : 0;
            return (
              <Card key={l.id}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{l.name}</div>
                    {l.note && <div style={{ fontSize: 11.5, color: "#697084", marginTop: 2 }}>{l.note}</div>}
                  </div>
                  <button onClick={() => { onDelete(l.id); flash("Loan removed"); }} style={{ background: "none", border: "none", color: "#697084", fontSize: 13 }}>✕</button>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 6 }}>
                  <span className="num" style={{ color: "#6B7FD7", fontWeight: 700 }}>{inr(l.remaining)} left</span>
                  <span style={{ color: "#697084" }}>of {inr(l.principal)}</span>
                </div>
                <div style={{ height: 5, background: "#232A38", borderRadius: 3, marginBottom: 10 }}><div style={{ height: 5, width: `${paidPct}%`, background: "#6B7FD7", borderRadius: 3 }} /></div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => onUpdate(l.id, Math.max(0, l.remaining - 1000))} style={{ flex: 1, background: "#12151C", border: "1px solid #2B3242", borderRadius: 7, color: "#EDEFF3", fontSize: 12, padding: "7px 0", fontWeight: 600 }}>− ₹1,000 paid</button>
                  <PayCustom loan={l} onUpdate={onUpdate} flash={flash} />
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PayCustom({ loan, onUpdate, flash }) {
  const [val, setVal] = useState("");
  return (
    <div style={{ display: "flex", gap: 6, flex: 1 }}>
      <input type="number" value={val} onChange={e => setVal(e.target.value)} placeholder="Custom ₹" style={{ width: 0, flex: 1, background: "#12151C", border: "1px solid #2B3242", borderRadius: 7, color: "#EDEFF3", fontSize: 12, padding: "7px 8px" }} />
      <button onClick={() => { if (!val) return; onUpdate(loan.id, Math.max(0, loan.remaining - Number(val))); flash("Payment recorded"); setVal(""); }} style={{ background: "#6B7FD7", border: "none", borderRadius: 7, color: "#12151C", fontWeight: 700, fontSize: 12, padding: "7px 10px" }}>Pay</button>
    </div>
  );
}

function ExpensesPanel({ expenses, accounts, onAdd, onDelete, accountColor, sourceLabel, sourceColor }) {
  const [open, setOpen] = useState(false);
  const [category, setCategory] = useState(CATEGORIES[0]);
  const [customCat, setCustomCat] = useState("");
  const [amount, setAmount] = useState("");
  const [source, setSource] = useState({ type: "cash" });
  const [note, setNote] = useState("");
  const total = expenses.reduce((s, e) => s + Number(e.amount), 0);

  const submit = () => {
    const cat = category === "__custom" ? customCat.trim() : category;
    if (!cat || !amount) return;
    onAdd({ category: cat, amount: Number(amount), source, note: note.trim(), date: today() });
    setAmount(""); setNote(""); setCustomCat(""); setOpen(false);
  };

  const isSameSource = (a, b) => a.type === b.type && (a.type === "cash" || a.accountId === b.accountId);

  return (
    <div style={{ animation: "slideUp .25s ease" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
        <div>
          <div className="serif" style={{ fontSize: 20, fontWeight: 600 }}>Expenses</div>
          <div className="num" style={{ fontSize: 13, color: "#C99A3E", fontWeight: 600, marginTop: 2 }}>{inr(total)} spent</div>
        </div>
        <button onClick={() => setOpen(o => !o)} style={{ background: open ? "#232A38" : "#C99A3E", color: open ? "#EDEFF3" : "#12151C", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 700 }}>{open ? "Cancel" : "+ Add"}</button>
      </div>

      {open && (
        <Card style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <Field label="Category">
              <select value={category} onChange={e => setCategory(e.target.value)} style={{ width: "100%", background: "#12151C", border: "1px solid #2B3242", borderRadius: 8, padding: "9px 10px", color: "#EDEFF3", fontSize: 13.5 }}>
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                <option value="__custom">Custom…</option>
              </select>
            </Field>
            <Field label="Amount"><MoneyInput value={amount} onChange={setAmount} /></Field>
          </div>
          {category === "__custom" && <div style={{ marginBottom: 10 }}><Field label="Category name"><TextInput value={customCat} onChange={setCustomCat} placeholder="e.g. Groceries" /></Field></div>}
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 11, color: "#8A93A6", marginBottom: 5 }}>Paid from</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button onClick={() => setSource({ type: "cash" })} style={{ padding: "8px 12px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, border: isSameSource(source, { type: "cash" }) ? `1px solid ${CASH_COLOR}` : "1px solid #2B3242", background: isSameSource(source, { type: "cash" }) ? CASH_COLOR + "22" : "#12151C", color: isSameSource(source, { type: "cash" }) ? CASH_COLOR : "#8A93A6" }}>Cash</button>
              {accounts.map(a => {
                const s = { type: "account", accountId: a.id };
                const active = isSameSource(source, s);
                const col = accountColor(a.id);
                return <button key={a.id} onClick={() => setSource(s)} style={{ padding: "8px 12px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, border: active ? `1px solid ${col}` : "1px solid #2B3242", background: active ? col + "22" : "#12151C", color: active ? col : "#8A93A6" }}>{a.name}</button>;
              })}
            </div>
            {accounts.length === 0 && <div style={{ fontSize: 11.5, color: "#697084", marginTop: 6 }}>Add bank accounts in the Accounts tab to pay from them.</div>}
          </div>
          <Field label="Note (optional)"><TextInput value={note} onChange={setNote} placeholder="e.g. groceries at DMart" /></Field>
          <button onClick={submit} style={{ marginTop: 12, background: "#C99A3E", color: "#12151C", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 700, width: "100%" }}>Save expense</button>
        </Card>
      )}

      {expenses.length === 0 ? <EmptyState text="No expenses logged yet." /> : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          {expenses.map((e, idx) => (
            <div key={e.id} className="row-hover" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 16px", borderBottom: idx < expenses.length - 1 ? "1px solid #232A38" : "none" }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{e.category}</div>
                <div style={{ fontSize: 11.5, color: "#697084", display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
                  <span style={{ color: sourceColor(e.source), background: sourceColor(e.source) + "1a", padding: "1px 6px", borderRadius: 4, fontWeight: 700, fontSize: 10.5 }}>{sourceLabel(e.source)}</span>
                  {fmtDate(e.date)}{e.note ? ` · ${e.note}` : ""}
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span className="num" style={{ fontWeight: 700, color: "#C99A3E", fontSize: 14.5 }}>{inr(e.amount)}</span>
                <button onClick={() => onDelete(e.id)} style={{ background: "none", border: "none", color: "#697084", fontSize: 13 }}>✕</button>
              </div>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

function EmptyState({ text }) {
  return <div style={{ textAlign: "center", padding: "40px 20px", color: "#697084", fontSize: 13.5, border: "1px dashed #2B3242", borderRadius: 12 }}>{text}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<MoneyManager />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
