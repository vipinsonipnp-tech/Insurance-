<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ledger CRM</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F3822" />
<link rel="icon" href="icon-512.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#F6F2E8; --surface:#FFFFFF; --surfaceAlt:#EFE8D8; --ink:#20301F; --inkSoft:#4A5548;
    --primary:#2F5233; --primaryDark:#1F3822; --primarySoft:#DCE6D5; --accent:#A9762F; --accentSoft:#EFDEBB;
    --danger:#9B3B34; --dangerSoft:#F1DBD5; --warn:#B8862E; --warnSoft:#F3E4C4; --muted:#8A8270; --border:#DED4BC;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  table { border-collapse: collapse; width:100%; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:9px 10px; font-size:13.5px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:hover td { background: color-mix(in srgb, var(--surfaceAlt) 60%, transparent); }
  input, select, textarea { font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink); outline:none; width:100%; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
