<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ledger CRM</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F3822" />
<link rel="icon" href="icon-512.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#F6F2E8; --surface:#FFFFFF; --surfaceAlt:#EFE8D8; --ink:#20301F; --inkSoft:#4A5548;
    --primary:#2F5233; --primaryDark:#1F3822; --primarySoft:#DCE6D5; --accent:#A9762F; --accentSoft:#EFDEBB;
    --danger:#9B3B34; --dangerSoft:#F1DBD5; --warn:#B8862E; --warnSoft:#F3E4C4; --muted:#8A8270; --border:#DED4BC;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  table { border-collapse: collapse; width:100%; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:9px 10px; font-size:13.5px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:hover td { background: color-mix(in srgb, var(--surfaceAlt) 60%, transparent); }
  input, select, textarea { font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink); outline:none; width:100%; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const C = {
  bg:"#F6F2E8", surface:"#FFFFFF", surfaceAlt:"#EFE8D8", ink:"#20301F", inkSoft:"#4A5548",
  primary:"#2F5233", primaryDark:"#1F3822", primarySoft:"#DCE6D5", accent:"#A9762F", accentSoft:"#EFDEBB",
  danger:"#9B3B34", dangerSoft:"#F1DBD5", warn:"#B8862E", warnSoft:"#F3E4C4", muted:"#8A8270", border:"#DED4BC",
};

const STORE_KEY = "ledger-crm-data";
const POLICY_TYPES = ["Life","Health","Auto","Home","Term","Whole Life","Disability","Other"];
const FUND_TYPES = ["Mutual Fund","ETF","Retirement","Equity","Debt","Hybrid","Other"];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const emptyData = () => ({ clients: [], policies: [], funds: [], tasks: [] });

const loadData = () => {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : emptyData();
  } catch (e) { return emptyData(); }
};
const saveData = (data) => {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; }
  catch (e) { return false; }
};

const fmtMoney = (n) => "$" + (Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const fmtDate = (d) => { if(!d) return "—"; const dt = new Date(d+"T00:00:00"); return isNaN(dt) ? d : dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
const daysUntil = (d) => { if(!d) return null; const t = new Date(); t.setHours(0,0,0,0); const target = new Date(d+"T00:00:00"); return Math.round((target-t)/86400000); };
const renewalState = (d) => { const n = daysUntil(d); if(n===null) return {label:"—",color:C.muted,bg:C.surfaceAlt}; if(n<0) return {label:"Overdue",color:C.danger,bg:C.dangerSoft}; if(n<=30) return {label:"Due soon",color:C.warn,bg:C.warnSoft}; return {label:"Active",color:C.primary,bg:C.primarySoft}; };

function Stamp({text,color,bg}){ return <span style={{display:"inline-flex",alignItems:"center",gap:5,fontFamily:"'IBM Plex Mono',monospace",fontSize:11,fontWeight:600,letterSpacing:"0.06em",textTransform:"uppercase",color,background:bg,border:`1px solid ${color}55`,borderRadius:999,padding:"3px 10px"}}>{text}</span>; }

function StatCard({label,value,sub}){
  return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"18px 20px",flex:1,minWidth:150}}>
    <div style={{fontSize:12,letterSpacing:"0.08em",textTransform:"uppercase",color:C.muted,fontWeight:600}}>{label}</div>
    <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:24,fontWeight:600,color:C.ink,marginTop:8}}>{value}</div>
    {sub && <div style={{fontSize:12,color:C.muted,marginTop:4}}>{sub}</div>}
  </div>;
}

function Field({label,children}){ return <label style={{display:"flex",flexDirection:"column",gap:5,fontSize:12.5,color:C.inkSoft,fontWeight:500}}>{label}{children}</label>; }

function Button({children,onClick,variant="primary",style,type="button",disabled}){
  const variants = {
    primary:{background:C.primary,color:"#fff",border:`1px solid ${C.primary}`},
    ghost:{background:"transparent",color:C.ink,border:`1px solid ${C.border}`},
    danger:{background:"transparent",color:C.danger,border:`1px solid ${C.danger}55`},
    accent:{background:C.accent,color:"#fff",border:`1px solid ${C.accent}`},
  };
  return <button type={type} onClick={onClick} disabled={disabled} style={{display:"inline-flex",alignItems:"center",gap:6,fontFamily:"'Inter',sans-serif",fontSize:13,fontWeight:600,padding:"8px 14px",borderRadius:6,cursor:disabled?"default":"pointer",opacity:disabled?0.6:1,...variants[variant],...style}}>{children}</button>;
}

function Modal({title,onClose,children}){
  return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(30,40,25,0.35)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.surface,borderRadius:12,padding:24,width:"100%",maxWidth:440,maxHeight:"88vh",overflowY:"auto",border:`1px solid ${C.border}`,boxShadow:"0 20px 60px rgba(30,40,25,0.25)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <h3 style={{fontFamily:"'Source Serif 4',serif",fontSize:19,fontWeight:600,color:C.ink,margin:0}}>{title}</h3>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:C.muted,fontSize:18}}>✕</button>
      </div>
      {children}
    </div>
  </div>;
}

function EmptyState({text,sub}){ return <div style={{textAlign:"center",padding:"36px 16px",color:C.muted}}><div style={{fontFamily:"'Source Serif 4',serif",fontSize:16,color:C.inkSoft,marginBottom:4}}>{text}</div>{sub && <div style={{fontSize:13}}>{sub}</div>}</div>; }

function RowActions({onEdit,onDelete}){
  return <td><div style={{display:"flex",gap:10}}>
    <button onClick={onEdit} style={{background:"none",border:"none",cursor:"pointer",color:C.muted}}>✎</button>
    <button onClick={onDelete} style={{background:"none",border:"none",cursor:"pointer",color:C.danger}}>🗑</button>
  </div></td>;
}

function SectionTable({title,addLabel,onAdd,headers,rows,empty}){
  return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <h3 style={{fontFamily:"'Source Serif 4',serif",fontSize:15,fontWeight:600,margin:0}}>{title}</h3>
      <Button variant="ghost" onClick={onAdd}>+ {addLabel}</Button>
    </div>
    {rows.length===0 ? <EmptyState text={empty}/> : <table><thead><tr>{headers.map((h,i)=><th key={i}>{h}</th>)}</tr></thead><tbody>{rows}</tbody></table>}
  </div>;
}

function App(){
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState("dashboard");
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);

  const persist = useCallback((next) => { setData(next); saveData(next); }, []);
  const upsert = (collection, item) => {
    const list = data[collection];
    const idx = list.findIndex(x=>x.id===item.id);
    const nextList = idx>=0 ? list.map(x=>x.id===item.id?item:x) : [...list, item];
    persist({...data, [collection]: nextList});
  };
  const remove = (collection, id) => persist({...data, [collection]: data[collection].filter(x=>x.id!==id)});
  const removeClientCascade = (clientId) => {
    persist({ clients: data.clients.filter(c=>c.id!==clientId), policies: data.policies.filter(p=>p.clientId!==clientId), funds: data.funds.filter(f=>f.clientId!==clientId), tasks: data.tasks.filter(t=>t.clientId!==clientId) });
    if (selectedClientId===clientId) setSelectedClientId(null);
  };
  const clientName = (id) => data.clients.find(c=>c.id===id)?.name || "Unknown";

  const totalPremium = data.policies.filter(p=>p.status!=="Cancelled").reduce((s,p)=>s+(Number(p.premium)||0)*(p.frequency==="Monthly"?12:1),0);
  const totalAUM = data.funds.filter(f=>f.status!=="Closed").reduce((s,f)=>s+(Number(f.amount)||0),0);
  const upcomingRenewals = data.policies.filter(p=>daysUntil(p.renewalDate)!==null && daysUntil(p.renewalDate)<=30).sort((a,b)=>daysUntil(a.renewalDate)-daysUntil(b.renewalDate));
  const openTasks = data.tasks.filter(t=>!t.done).sort((a,b)=>new Date(a.dueDate||"9999")-new Date(b.dueDate||"9999"));

  const NAV = [["dashboard","Ledger"],["clients","Clients"],["policies","Policies"],["funds","Funds"],["tasks","Tasks"]];

  return <div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Inter',sans-serif",color:C.ink}}>
    <header style={{background:C.primaryDark,padding:"0 24px",display:"flex",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"16px 0"}}>
        <div style={{width:30,height:30,borderRadius:6,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Source Serif 4',serif",fontWeight:700,color:"#fff",fontSize:16}}>L</div>
        <span style={{fontFamily:"'Source Serif 4',serif",fontSize:19,fontWeight:600,color:"#fff"}}>Ledger CRM</span>
      </div>
    </header>
    <nav style={{display:"flex",gap:4,padding:"0 20px",background:C.primaryDark,overflowX:"auto"}}>
      {NAV.map(([id,label])=>{
        const active = tab===id;
        return <button key={id} onClick={()=>setTab(id)} style={{fontFamily:"'Inter',sans-serif",fontSize:13.5,fontWeight:600,padding:"10px 16px",background:active?C.bg:"transparent",color:active?C.ink:"#E6E1D2",border:"none",borderTopLeftRadius:8,borderTopRightRadius:8,cursor:"pointer",whiteSpace:"nowrap"}}>{label}</button>;
      })}
    </nav>

    <main style={{padding:20,maxWidth:1100,margin:"0 auto"}}>
      {tab==="dashboard" && <div>
        <h1 style={{fontFamily:"'Source Serif 4',serif",fontSize:24,fontWeight:600,margin:"4px 0 16px"}}>This week's ledger</h1>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:20}}>
          <StatCard label="Clients" value={data.clients.length}/>
          <StatCard label="Annual premium" value={fmtMoney(totalPremium)} sub="active policies"/>
          <StatCard label="AUM" value={fmtMoney(totalAUM)} sub="active funds"/>
          <StatCard label="Renewals ≤30d" value={upcomingRenewals.length}/>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:18,marginBottom:16}}>
          <h3 style={{fontFamily:"'Source Serif 4',serif",fontSize:15,fontWeight:600,margin:"0 0 12px"}}>Open tasks</h3>
          {openTasks.length===0 ? <EmptyState text="Nothing pending"/> : <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {openTasks.slice(0,8).map(t=><div key={t.id} style={{display:"flex",justifyContent:"space-between",fontSize:13,paddingBottom:6,borderBottom:`1px solid ${C.border}`}}>
              <div><div style={{fontWeight:500}}>{t.title}</div><div style={{color:C.muted,fontSize:12}}>{clientName(t.clientId)}</div></div>
              <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.muted}}>{fmtDate(t.dueDate)}</span>
            </div>)}
          </div>}
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:18}}>
          <h3 style={{fontFamily:"'Source Serif 4',serif",fontSize:15,fontWeight:600,margin:"0 0 12px"}}>Upcoming & overdue renewals</h3>
          {upcomingRenewals.length===0 ? <EmptyState text="Nothing due"/> : <table><thead><tr><th>Client</th><th>Insurer</th><th>Renewal</th><th>Status</th></tr></thead><tbody>
            {upcomingRenewals.map(p=>{ const st=renewalState(p.renewalDate); return <tr key={p.id}><td>{clientName(p.clientId)}</td><td>{p.insurer}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtDate(p.renewalDate)}</td><td><Stamp text={st.label} color={st.color} bg={st.bg}/></td></tr>; })}
          </tbody></table>}
        </div>
      </div>}

      {tab==="clients" && <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:16}}>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:14,height:"fit-content"}}>
          <input placeholder="Search clients" value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:10}}/>
          <Button onClick={()=>setModal({type:"client"})} style={{width:"100%",justifyContent:"center",marginBottom:10}}>+ Add client</Button>
          {data.clients.filter(c=>(c.name+" "+(c.company||"")).toLowerCase().includes(search.toLowerCase())).map(c=>
            <button key={c.id} onClick={()=>setSelectedClientId(c.id)} style={{display:"block",width:"100%",textAlign:"left",padding:"9px 10px",borderRadius:7,border:"none",cursor:"pointer",background:selectedClientId===c.id?C.primarySoft:"transparent",marginBottom:2}}>
              <div style={{fontWeight:600,fontSize:13.5}}>{c.name}</div><div style={{fontSize:12,color:C.muted}}>{c.company||c.email||"—"}</div>
            </button>)}
        </div>
        <div>
          {!selectedClientId ? <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:30}}><EmptyState text="Select a client" sub="Choose one on the left, or add a new one."/></div> :
            (()=>{ const client = data.clients.find(c=>c.id===selectedClientId); if(!client) return null;
              const policies = data.policies.filter(p=>p.clientId===client.id);
              const funds = data.funds.filter(f=>f.clientId===client.id);
              const tasks = data.tasks.filter(t=>t.clientId===client.id);
              return <div style={{display:"flex",flexDirection:"column",gap:16}}>
                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:20}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <div><h2 style={{fontFamily:"'Source Serif 4',serif",fontSize:22,fontWeight:600,margin:0}}>{client.name}</h2>{client.company && <div style={{color:C.muted,fontSize:13}}>{client.company}</div>}</div>
                    <div style={{display:"flex",gap:8}}>
                      <Button variant="ghost" onClick={()=>setModal({type:"client",editing:client})}>Edit</Button>
                      <Button variant="danger" onClick={()=>{ if(confirm(`Remove ${client.name} and all records?`)) removeClientCascade(client.id); }}>Remove</Button>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:16,marginTop:10,flexWrap:"wrap",fontSize:13,color:C.inkSoft}}>{client.email && <span>{client.email}</span>}{client.phone && <span>{client.phone}</span>}</div>
                </div>
                <SectionTable title="Policies" addLabel="Add policy" onAdd={()=>setModal({type:"policy",defaultClientId:client.id})} headers={["Insurer","Type","Premium","Renewal","Status",""]} empty="No policies yet."
                  rows={policies.map(p=>{ const st=renewalState(p.renewalDate); return <tr key={p.id}><td>{p.insurer}</td><td>{p.type}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtMoney(p.premium)}/{p.frequency==="Monthly"?"mo":"yr"}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtDate(p.renewalDate)}</td><td><Stamp text={st.label} color={st.color} bg={st.bg}/></td><RowActions onEdit={()=>setModal({type:"policy",editing:p})} onDelete={()=>remove("policies",p.id)}/></tr>; })}/>
                <SectionTable title="Funds" addLabel="Add fund" onAdd={()=>setModal({type:"fund",defaultClientId:client.id})} headers={["Fund","Type","Amount","Status",""]} empty="No funds yet."
                  rows={funds.map(f=><tr key={f.id}><td>{f.fundName}</td><td>{f.type}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtMoney(f.amount)}</td><td><Stamp text={f.status} color={f.status==="Active"?C.primary:C.muted} bg={f.status==="Active"?C.primarySoft:C.surfaceAlt}/></td><RowActions onEdit={()=>setModal({type:"fund",editing:f})} onDelete={()=>remove("funds",f.id)}/></tr>)}/>
                <SectionTable title="Tasks" addLabel="Add task" onAdd={()=>setModal({type:"task",defaultClientId:client.id})} headers={["Task","Due","Status",""]} empty="No tasks yet."
                  rows={tasks.map(t=><tr key={t.id}><td>{t.title}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtDate(t.dueDate)}</td><td><Stamp text={t.done?"Done":"Open"} color={t.done?C.primary:C.warn} bg={t.done?C.primarySoft:C.warnSoft}/></td><RowActions onEdit={()=>setModal({type:"task",editing:t})} onDelete={()=>remove("tasks",t.id)}/></tr>)}/>
              </div>;
            })()}
        </div>
      </div>}

      {tab==="policies" && <div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}><h1 style={{fontFamily:"'Source Serif 4',serif",fontSize:22,fontWeight:600,margin:0}}>All policies</h1><Button onClick={()=>setModal({type:"policy"})} disabled={data.clients.length===0}>+ Add policy</Button></div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:16}}>
          {data.policies.length===0 ? <EmptyState text="No policies yet"/> : <table><thead><tr><th>Client</th><th>Insurer</th><th>Type</th><th>Premium</th><th>Renewal</th><th>Status</th><th></th></tr></thead><tbody>
            {[...data.policies].sort((a,b)=>(daysUntil(a.renewalDate)??9999)-(daysUntil(b.renewalDate)??9999)).map(p=>{ const st=renewalState(p.renewalDate); return <tr key={p.id}><td>{clientName(p.clientId)}</td><td>{p.insurer}</td><td>{p.type}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtMoney(p.premium)}/{p.frequency==="Monthly"?"mo":"yr"}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtDate(p.renewalDate)}</td><td><Stamp text={st.label} color={st.color} bg={st.bg}/></td><RowActions onEdit={()=>setModal({type:"policy",editing:p})} onDelete={()=>remove("policies",p.id)}/></tr>; })}
          </tbody></table>}
        </div>
      </div>}

      {tab==="funds" && <div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}><h1 style={{fontFamily:"'Source Serif 4',serif",fontSize:22,fontWeight:600,margin:0}}>All funds</h1><Button onClick={()=>setModal({type:"fund"})} disabled={data.clients.length===0}>+ Add fund</Button></div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:16}}>
          {data.funds.length===0 ? <EmptyState text="No funds yet"/> : <table><thead><tr><th>Client</th><th>Fund</th><th>Type</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>
            {data.funds.map(f=><tr key={f.id}><td>{clientName(f.clientId)}</td><td>{f.fundName}</td><td>{f.type}</td><td style={{fontFamily:"'IBM Plex Mono',monospace"}}>{fmtMoney(f.amount)}</td><td><Stamp text={f.status} color={f.status==="Active"?C.primary:C.muted} bg={f.status==="Active"?C.primarySoft:C.surfaceAlt}/></td><RowActions onEdit={()=>setModal({type:"fund",editing:f})} onDelete={()=>remove("funds",f.id)}/></tr>)}
          </tbody></table>}
        </div>
      </div>}

      {tab==="tasks" && <div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}><h1 style={{fontFamily:"'Source Serif 4',serif",fontSize:22,fontWeight:600,margin:0}}>All tasks</h1><Button onClick={()=>setModal({type:"task"})} disabled={data.clients.length===0}>+ Add task</Button></div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:16}}>
          {data.tasks.length===0 ? <EmptyState text="No tasks yet"/> : <div>
            {[...data.tasks].sort((a,b)=>Number(a.done)-Number(b.done)).map(t=>
              <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 4px",borderBottom:`1px solid ${C.border}`}}>
                <button onClick={()=>upsert("tasks",{...t,done:!t.done})} style={{background:"none",border:"none",cursor:"pointer",color:t.done?C.primary:C.muted,fontSize:16}}>{t.done?"☑":"☐"}</button>
                <div style={{flex:1}}><div style={{fontSize:13.5,fontWeight:500,textDecoration:t.done?"line-through":"none",color:t.done?C.muted:C.ink}}>{t.title}</div><div style={{fontSize:12,color:C.muted}}>{clientName(t.clientId)}</div></div>
                <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.muted}}>{fmtDate(t.dueDate)}</span>
                <RowActions onEdit={()=>setModal({type:"task",editing:t})} onDelete={()=>remove("tasks",t.id)}/>
              </div>)}
          </div>}
        </div>
      </div>}
    </main>

    {modal && <FormModal modal={modal} data={data} onClose={()=>setModal(null)} onSave={(collection,item)=>{ upsert(collection,item); setModal(null); }}/>}
  </div>;
}

function FormModal({modal,data,onClose,onSave}){
  const {type,editing} = modal;
  const clientIdDefault = editing?.clientId || modal.defaultClientId || (data.clients[0]?.id ?? "");
  const [form,setForm] = useState(()=>{
    if(type==="client") return editing || {name:"",email:"",phone:"",company:"",notes:""};
    if(type==="policy") return editing || {clientId:clientIdDefault,insurer:"",type:POLICY_TYPES[0],policyNumber:"",premium:"",frequency:"Annual",startDate:"",renewalDate:"",status:"Active"};
    if(type==="fund") return editing || {clientId:clientIdDefault,fundName:"",type:FUND_TYPES[0],amount:"",startDate:"",status:"Active"};
    if(type==="task") return editing || {clientId:clientIdDefault,title:"",dueDate:"",notes:"",done:false};
    return {};
  });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const submit = (e) => { e.preventDefault(); const collection = {client:"clients",policy:"policies",fund:"funds",task:"tasks"}[type]; onSave(collection, {...form, id: form.id||uid()}); };
  const titles = {client:editing?"Edit client":"Add client",policy:editing?"Edit policy":"Add policy",fund:editing?"Edit fund":"Add fund",task:editing?"Edit task":"Add task"};

  return <Modal title={titles[type]} onClose={onClose}>
    <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:12}}>
      {type==="client" && <>
        <Field label="Name"><input required value={form.name} onChange={e=>set("name",e.target.value)}/></Field>
        <Field label="Company"><input value={form.company} onChange={e=>set("company",e.target.value)}/></Field>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="Email"><input type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></Field>
          <Field label="Phone"><input value={form.phone} onChange={e=>set("phone",e.target.value)}/></Field>
        </div>
        <Field label="Notes"><textarea rows={3} value={form.notes} onChange={e=>set("notes",e.target.value)}/></Field>
      </>}
      {type==="policy" && <>
        <Field label="Client"><select required value={form.clientId} onChange={e=>set("clientId",e.target.value)}><option value="" disabled>Select</option>{data.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="Insurer"><input required value={form.insurer} onChange={e=>set("insurer",e.target.value)}/></Field>
          <Field label="Type"><select value={form.type} onChange={e=>set("type",e.target.value)}>{POLICY_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></Field>
        </div>
        <Field label="Policy number"><input value={form.policyNumber} onChange={e=>set("policyNumber",e.target.value)}/></Field>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="Premium"><input type="number" min="0" value={form.premium} onChange={e=>set("premium",e.target.value)}/></Field>
          <Field label="Frequency"><select value={form.frequency} onChange={e=>set("frequency",e.target.value)}><option>Annual</option><option>Monthly</option></select></Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="Start date"><input type="date" value={form.startDate} onChange={e=>set("startDate",e.target.value)}/></Field>
          <Field label="Renewal date"><input type="date" value={form.renewalDate} onChange={e=>set("renewalDate",e.target.value)}/></Field>
        </div>
        <Field label="Status"><select value={form.status} onChange={e=>set("status",e.target.value)}><option>Active</option><option>Lapsed</option><option>Cancelled</option></select></Field>
      </>}
      {type==="fund" && <>
        <Field label="Client"><select required value={form.clientId} onChange={e=>set("clientId",e.target.value)}><option value="" disabled>Select</option>{data.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="Fund name"><input required value={form.fundName} onChange={e=>set("fundName",e.target.value)}/></Field>
          <Field label="Type"><select value={form.type} onChange={e=>set("type",e.target.value)}>{FUND_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="Amount"><input type="number" min="0" value={form.amount} onChange={e=>set("amount",e.target.value)}/></Field>
          <Field label="Start date"><input type="date" value={form.startDate} onChange={e=>set("startDate",e.target.value)}/></Field>
        </div>
        <Field label="Status"><select value={form.status} onChange={e=>set("status",e.target.value)}><option>Active</option><option>Closed</option></select></Field>
      </>}
      {type==="task" && <>
        <Field label="Client"><select required value={form.clientId} onChange={e=>set("clientId",e.target.value)}><option value="" disabled>Select</option>{data.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
        <Field label="Task"><input required value={form.title} onChange={e=>set("title",e.target.value)}/></Field>
        <Field label="Due date"><input type="date" value={form.dueDate} onChange={e=>set("dueDate",e.target.value)}/></Field>
        <Field label="Notes"><textarea rows={2} value={form.notes} onChange={e=>set("notes",e.target.value)}/></Field>
      </>}
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}>
        <Button variant="ghost" onClick={onClose}>Cancel</Button>
        <Button type="submit">{editing?"Save changes":"Add"}</Button>
      </div>
    </form>
  </Modal>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
